name: CI

# `main` is the pristine drill kit: every exercise is an unimplemented stub, so
# the test suite is *expected* to fail there. CI therefore gates on what should
# always hold — the code lints, type checks, and the suite imports and collects
# cleanly — and reports drill progress informationally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create environment on Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Collect tests
        run: uv run pytest --collect-only -q

      - name: Drill progress (informational)
        run: uv run python scripts/progress.py

      - name: Run drills (informational — stubs are expected to fail)
        continue-on-error: true
        run: uv run pytest --tb=no -q
